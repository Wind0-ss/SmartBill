<style>
        body {
            font-family: 'Inter', 'Sarabun', sans-serif;
            background-color: #f8fafc; /* Forced requirement from prompt */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        /* Custom subtle shadow for Level 1 Card as per design system */
        .card-shadow {
            box-shadow: 0px 4px 12px rgba(30, 41, 59, 0.03);
            border: 1px solid #e2e8f0;
        }
        .gateway-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
        }
        .transition-all-custom {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

<body class="bg-background text-on-surface">
<main class="gateway-container">
<!-- Vertical White Card (Bento-style centered) -->
<div class="bg-white rounded-xl card-shadow w-full max-w-[440px] px-lg py-xl flex flex-col items-center animate-fade-in">
<!-- Logo & Name Section -->

<div class="w-16 h-16 bg-surface-container-low rounded-full flex items-center justify-center mb-md">

</div>
<h1 class="text-headline-md font-headline-md font-extrabold text-primary tracking-tight">Smart Bill</h1>
<p class="text-on-surface-variant font-body-sm text-sm mt-xs">ระบบตรวจสอบค่าน้ำและค่าไฟของห้องพัก</p>
</div>
<!-- Image Asset for Branding -->
<div class="w-full mb-lg overflow-hidden rounded-lg aspect-[16/9]">
<img class="w-full h-full object-cover" data-alt="A clean, minimalist 3D rendering of a modern apartment building exterior during a bright sunny day. The style is architectural visualization with soft shadows and a pristine light-gray color palette. Subtle blue accents appear in the glass reflections, evoking a sense of clarity, financial transparency, and organized property management." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrQ5ly62dQBlYA2iZ_iTw8YayjEd0cfx7tZTZ-1-EDB1OErsIcyJCF6sCjIJBdcCF2XAPPGnzXG66WJx4lqiTf1YdTnF_2VglVqPjnI86PldPKcZA2Mx6dCqVZ4T0z9iN--5Ykk7hL8NQjgT2OAM1id1e2Vw3bqVMJVzEOskgqPNtS4jt4tNns7HVoUiwrqOFbjwkdZlG7LabIjcuNXLywZnTQfMgT3upX84_sk2ytM8E-j5GCu6S-MFsycqW4ZKIpxgno3lS5NSM"/>
</div>
<!-- Tenant Search Section -->
<div class="w-full space-y-md">
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant block ml-1" for="room_number">หมายเลขห้องพัก</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant">meeting_room</span>
<input class="w-full pl-xl pr-md py-md bg-surface-bright border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-outline-variant transition-all-custom" id="room_number" name="room_number" placeholder="เช่น 101, A205" type="text"/>
</div>
</div>
<button class="w-full bg-[#bfdbfe] hover:bg-[#93c5fd] text-primary font-bold py-md px-lg rounded-lg transition-all-custom flex items-center justify-center gap-sm active:scale-[0.98]">
<span>ค้นหาบิลของฉัน</span>
<span class="material-symbols-outlined">search</span>
</button>
</div>
<!-- Divider -->
<div class="w-full flex items-center my-lg">
<div class="flex-grow border-t border-outline-variant opacity-50"></div>
<span class="px-md text-body-sm text-outline font-medium">หรือ</span>
<div class="flex-grow border-t border-outline-variant opacity-50"></div>
</div>

</a>

<p class="mt-xl text-[12px] text-outline text-center">

            </p>

</main>
<!-- Footer Content (Based on Shared Components JSON) - Hidden or Minimal on Portal -->
<!-- We skip the full TopNavBar/Footer as requested for Transactional/Portal screen focus -->
<script>
        // Simple Interaction Logic
        const roomInput = document.getElementById('room_number');
        const searchBtn = document.querySelector('button');

        searchBtn.addEventListener('click', () => {
            if (roomInput.value.trim() === "") {
                roomInput.classList.add('border-error');
                setTimeout(() => roomInput.classList.remove('border-error'), 1000);
            } else {
                // Simulate Loading
                searchBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span><span>กำลังค้นหา...</span>';
                setTimeout(() => {
                    searchBtn.innerHTML = '<span>ค้นหาบิลของฉัน</span><span class="material-symbols-outlined">search</span>';
                    alert('ไม่พบข้อมูลห้อง ' + roomInput.value + ' ในระบบปัจจุบัน');
                }, 1500);
            }
        });

        // Focus transition enhancement
        roomInput.addEventListener('focus', () => {
            roomInput.parentElement.querySelector('.material-symbols-outlined').style.color = '#0058be';
        });
        roomInput.addEventListener('blur', () => {
            roomInput.parentElement.querySelector('.material-symbols-outlined').style.color = '#c2c6d6';
        });
    </script>
